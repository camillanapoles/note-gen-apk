name: 'build-apk'

on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: ['feature/**']
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promover apk-candidate a apk-validated (após E2E no dispositivo)'
        type: boolean
        default: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      appversion: ${{ steps.get_version.outputs.version }}
      sha7: ${{ steps.get_version.outputs.sha7 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Initialize and Build Android
        run: |
          export PATH=$PATH:$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          test -d src-tauri/gen/android/app/src/main || { echo "init failed"; exit 1; }
          git checkout -- \
            src-tauri/gen/android/app/build.gradle.kts \
            src-tauri/gen/android/app/src/main/AndroidManifest.xml \
            src-tauri/gen/android/app/src/main/java/com/codexu/NoteGen/OcrPlugin.kt \
            src-tauri/gen/android/app/src/main/java/com/codexu/NoteGen/SystemBarsPlugin.kt \
            src-tauri/gen/android/app/src/main/res/values/colors.xml \
            src-tauri/gen/android/app/src/main/res/values/themes.xml \
            src-tauri/gen/android/app/src/main/res/values-night/themes.xml || true
          pnpm tauri android build --apk

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep -o '"version": *"[^"]*"' src-tauri/tauri.conf.json | head -1 | sed 's/"version": *"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha7=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/android-release.keystore
          test -s src-tauri/android-release.keystore || { echo "keystore vazio"; exit 1; }

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri
          APK_PATH="gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          test -f "$APK_PATH" || { ls -R gen/android/app/build/outputs/apk/ ; exit 1; }
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)
          OUT="gen/android/app/build/outputs/apk/universal/release/NoteGenCNMFS_${{ steps.get_version.outputs.version }}_${{ steps.get_version.outputs.sha7 }}.apk"
          $BT/apksigner sign --ks android-release.keystore --ks-key-alias notegen-cnmfs \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" --key-pass pass:"$ANDROID_KEY_PASSWORD" \
            --out "$OUT" "$APK_PATH"
          $BT/apksigner verify --verbose "$OUT" | tee /tmp/apksigner.log
          # GATE T-S01-02: v2 obrigatoria (minSdk>=24 dispensa v1); v1 fica informativo
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.log || { echo "GATE: assinatura v2 NAO verificada"; exit 1; }
          grep -q "Number of signers: 1" /tmp/apksigner.log || { echo "GATE: numero de signers != 1"; exit 1; }
          echo "APK_SIGNED=$OUT" >> $GITHUB_ENV

      - name: Verification tests (gates estáticos)
        run: |
          set -eu
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)
          APK="$APK_SIGNED"
          # T-S01-03: badging contém pacote+versão
          $BT/aapt dump badging "$APK" | grep -E "^package:.*versionName"
          # T-S02-01 (quando S02 landar): permissão de storage no manifest
          # $BT/aapt dump permissions "$APK" | grep android.permission.MANAGE_EXTERNAL_STORAGE
          # T-S01-04: estrutura zip íntegra
          unzip -t "$APK" > /dev/null && echo "zip OK"
          echo "GATES-STATIC: PASS"

      - name: Upload apk-candidate
        uses: actions/upload-artifact@v4
        with:
          name: apk-candidate
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/NoteGenCNMFS_*.apk
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        run: rm -f src-tauri/android-release.keystore

  promote-validated:
    if: github.event_name == 'workflow_dispatch' && inputs.promote == true
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: apk-candidate
      - name: Re-upload como apk-validated + release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la
          # E2E já executado no dispositivo — ver docs/reports/S05.md
          gh release create "cnmfs-v${{ needs.build-android.outputs.appversion }}+${{ needs.build-android.outputs.sha7 }}" \
            NoteGenCNMFS_*.apk --title "NoteGen CNMFS v${{ needs.build-android.outputs.appversion }} (${{ needs.build-android.outputs.sha7 }})" \
            --notes "APK validado: gates estáticos CI + E2E dispositivo. Ver docs/reports/." || true
